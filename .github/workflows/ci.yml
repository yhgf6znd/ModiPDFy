name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust, WASM, JavaScript, and static build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Set up pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.93.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install independent PDF verification tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ghostscript poppler-utils

      - name: Install Node.js dependencies
        run: npm ci

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Audit JavaScript dependencies
        run: npm audit --omit=optional --audit-level=moderate

      - name: Generate and verify SBOM
        run: npm run generate:sbom && git diff --exit-code -- docs/sbom.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build the WASM package
        run: npm run build:wasm

      - name: Run JavaScript and WASM integration tests
        run: npm test

      - name: Build the complete web application
        run: npm run build

      - name: Validate generated static assets
        run: npm run validate:build

      - name: Install Chromium for production smoke test
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke test
        run: npm run test:browser

      - name: Run browser integration harness
        run: npm run test:browser:harness
