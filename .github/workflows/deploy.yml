name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Set up pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.93.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install independent PDF verification tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ghostscript poppler-utils

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run the complete CI test suite
        run: npm test

      - name: Build deployment artifact
        env:
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Validate deployment artifact
        env:
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run validate:build

      - name: Install Chromium for production smoke test
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke test
        run: npm run test:browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy Pages artifact
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
