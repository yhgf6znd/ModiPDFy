<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172033">
    <meta name="description" content="A privacy-first PDF editor that runs in your browser.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./pdfjs/pdf_viewer.css">
    <title>ModiPDFy</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <p class="eyebrow">Private by design</p>
          <h1>ModiPDFy</h1>
        </div>
        <div class="file-actions">
          <label class="button button-primary" for="file-input">Open PDF</label>
          <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
          <span id="document-name" class="document-name">No document open</span>
        </div>
      </header>

      <section class="toolbar" aria-label="PDF controls">
        <button id="previous-page" class="button" type="button" disabled aria-label="Previous page">Previous</button>
        <label class="page-control" for="page-input">
          <span class="visually-hidden">Current page</span>
          <input id="page-input" type="number" min="1" value="0" inputmode="numeric" disabled>
          <span aria-hidden="true">/</span>
          <span id="page-count">0</span>
        </label>
        <button id="next-page" class="button" type="button" disabled aria-label="Next page">Next</button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="zoom-out" class="button" type="button" disabled aria-label="Zoom out">−</button>
        <span id="zoom-level" class="zoom-level" aria-live="polite">100%</span>
        <button id="zoom-in" class="button" type="button" disabled aria-label="Zoom in">+</button>
        <button id="fit-width" class="button" type="button" disabled>Fit width</button>
        <button id="fit-page" class="button" type="button" disabled>Fit page</button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <div class="tool-group" role="toolbar" aria-label="Annotation tools">
          <button class="button tool-button is-active" type="button" data-tool="select" aria-pressed="true" title="Select (V)">Select</button>
          <button class="button tool-button" type="button" data-tool="text" aria-pressed="false" title="Text (T)">Text</button>
          <button class="button tool-button" type="button" data-tool="pen" aria-pressed="false" title="Pen (P)">Pen</button>
          <button class="button tool-button" type="button" data-tool="highlight" aria-pressed="false" title="Highlight (H)">Highlight</button>
          <button class="button tool-button" type="button" data-tool="eraser" aria-pressed="false" title="Delete (E)">Delete</button>
        </div>
        <label class="property-control" for="annotation-color">Color <input id="annotation-color" type="color" value="#254b87" disabled></label>
        <label class="property-control" for="annotation-width">Width <input id="annotation-width" type="range" min="1" max="20" value="3" disabled></label>
        <label class="property-control" for="annotation-font-size">Font <input id="annotation-font-size" type="number" min="6" max="72" value="14" disabled></label>
        <button id="delete-selected" class="button" type="button" disabled>Delete selected</button>
        <button id="undo" class="button" type="button" disabled aria-label="Undo">Undo</button>
        <button id="redo" class="button" type="button" disabled aria-label="Redo">Redo</button>
        <button id="export-pdf" class="button button-primary" type="button" disabled>Export PDF</button>
      </section>

      <main id="viewer-viewport" class="viewer-viewport" tabindex="0" aria-label="PDF document viewer">
        <div id="dropzone" class="dropzone" role="status">
          <p class="dropzone-title">Open a PDF to begin</p>
          <p>Choose a local file or drag it here. The document stays in this browser.</p>
        </div>
        <div id="pdf-pages" class="pdf-pages" aria-live="off"></div>
      </main>

      <footer class="app-footer">
        <p id="status" class="status" role="status">Loading the Rust/WASM core…</p>
        <p class="version-line">Core version: <span id="version">Loading…</span></p>
      </footer>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
